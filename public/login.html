<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso del administrador | Servicios Express</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <a class="saltar" href="#contenido">Saltar al contenido</a>
  <header class="encabezado">
    <div class="contenedor encabezado__interior">
      <a class="marca" href="/" aria-label="Servicios Express, inicio">
        <!-- Logo: enchufe (conexión) con un rayo (rapidez = "Express") -->
        <svg class="marca__icono" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="10" y="1" width="3" height="6" rx="1.2" fill="currentColor"/>
          <rect x="19" y="1" width="3" height="6" rx="1.2" fill="currentColor"/>
          <rect x="4" y="5.5" width="24" height="20" rx="6" fill="currentColor"/>
          <path d="M16 25v5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M17.5 5 9 17.5h6L13.5 27 23 13.5h-6.2z" fill="#0c2461" transform="translate(16 15.5) scale(.74) translate(-16 -16)"/>
        </svg>
        <span class="marca__texto">
          <span class="marca__nombre">Servicios Express</span>
          <small class="marca__lema">Soporte técnico en casa y remoto</small>
        </span>
      </a>
      <!-- Cable decorativo entre la marca y el menú (solo escritorio):
           hilo amarillo + conector RJ45 + luces de puerto que parpadean -->
      <span class="encabezado__cable" aria-hidden="true">
        <span class="cable__hilo"></span>
        <svg class="cable__conector" viewBox="0 0 28 20" focusable="false">
          <rect x="0" y="6" width="6" height="8" rx="2" fill="#ffd400"/>
          <path d="M5 4a2 2 0 0 1 2-2h3l1-2h6l1 2h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z" fill="#ffd400"/>
          <path d="M11 9v6M14 9v6M17 9v6M20 9v6M23 9v6" stroke="#0c2461" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <span class="cable__leds"><i></i><i></i><i></i></span>
      </span>
      <nav aria-label="Navegación principal">
        <ul class="menu">
          <li><a href="/">Volver al inicio</a></li>
        </ul>
      </nav>
      <a class="boton boton--amarillo encabezado__accion" href="/#contacto">Pedir ayuda</a>
    </div>
  </header>

  <main id="contenido">
    <section class="seccion seccion--tinte" aria-labelledby="titulo-login">
      <div class="contenedor contenedor--estrecho">
        <h1 id="titulo-login">Acceso del administrador</h1>
        <p class="seccion__intro">Ingresa para consultar y gestionar las solicitudes.</p>
        <form id="form-login" class="formulario" novalidate>
          <div class="campo">
            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" name="usuario" autocomplete="username">
          </div>
          <div class="campo">
            <label for="clave">Contraseña</label>
            <input type="password" id="clave" name="clave" autocomplete="current-password">
          </div>
          <button type="submit" class="boton boton--oscuro">Iniciar sesión</button>
          <p id="mensaje" class="resultado" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="pie">
    <div class="contenedor pie__interior">
      <p class="pie__marca">Servicios Express</p>
      <p class="pie__nota">Caso práctico 2 · Registro de solicitudes</p>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
